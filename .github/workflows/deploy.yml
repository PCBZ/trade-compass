name: Deploy

on:
  push:
    tags: ["v*"] # releasing is deliberate: `git tag v0.1.0 && git push origin v0.1.0`
  workflow_dispatch: # deploy the current ref by hand from the Actions tab

# One deploy at a time. Keyed on github.ref this would be per-tag, i.e. not
# serialised at all — every tag targets the same project and tfstate.
concurrency:
  group: deploy
  cancel-in-progress: false

# Both modules apply on every tag. There is no useful base to diff a tag
# against, and filtering is only an optimisation here: the image is tagged
# :${src_hash} and the build is triggered on that hash, so a component whose
# source is unchanged rebuilds nothing and produces no new revision.
jobs:
  deploy-api:
    name: Deploy api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform/cloud_run
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Terraform apply
        env:
          BUCKET: trade-compass-tfstate-${{ vars.GCP_PROJECT_ID }}
        run: |
          terraform init \
            -backend-config="bucket=${BUCKET}" \
            -backend-config="prefix=cloud_run"
          terraform apply -auto-approve \
            -var="gcp_project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="tfstate_bucket=${BUCKET}"

  deploy-bot:
    name: Deploy bot
    # After api: the bot module reads the api's Cloud Run URL from its remote state.
    needs: deploy-api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform/bot
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Terraform apply
        env:
          BUCKET: trade-compass-tfstate-${{ vars.GCP_PROJECT_ID }}
        run: |
          terraform init \
            -backend-config="bucket=${BUCKET}" \
            -backend-config="prefix=bot"
          terraform apply -auto-approve \
            -var="gcp_project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="tfstate_bucket=${BUCKET}" \
            -var="sec_contact=${{ vars.SEC_CONTACT }}" \
            -var="telegram_bot_token=${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            -var="telegram_chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -var="fmp_api_key=${{ secrets.FMP_API_KEY }}" \
            -var="openrouter_api_key=${{ secrets.OPENROUTER_API_KEY }}"
