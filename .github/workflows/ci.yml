name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Format check
        run: terraform fmt -check -recursive terraform/

      - name: Validate bootstrap
        run: cd terraform/bootstrap && terraform init -backend=false && terraform validate

      - name: Validate compute_engine
        run: cd terraform/compute_engine && terraform init -backend=false && terraform validate

      - name: Validate atlas
        run: cd terraform/atlas && terraform init -backend=false && terraform validate

      - name: Validate cloud_run
        run: cd terraform/cloud_run && terraform init -backend=false && terraform validate

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r api/requirements-dev.txt -r bot/requirements-dev.txt -r bot/requirements.txt -r sync/requirements.txt

      - name: Lint
        run: ruff check api/src/ bot/src/ sync/src/

      - name: Format check
        run: ruff format --check api/src/ bot/src/ sync/src/

      - name: Test
        run: cd api && pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Test bot units
        run: cd bot && pytest tests/unit tests/integration -v --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Test sync
        run: cd sync && pytest tests -v

      # Both packages are named src/, so prefix each report's paths with its
      # directory (the XML paths are relative to src/) or Codecov would merge api/src/main.py with bot/src/main.py.
      - name: Prefix coverage paths
        run: |
          sed -i 's#filename="#filename="api/src/#' api/coverage.xml
          sed -i 's#filename="#filename="bot/src/#' bot/coverage.xml

      - name: Upload API coverage
        uses: codecov/codecov-action@v5
        with:
          files: api/coverage.xml
          flags: api
          disable_search: true
          fail_ci_if_error: false

      - name: Upload bot coverage
        uses: codecov/codecov-action@v5
        with:
          files: bot/coverage.xml
          flags: bot
          disable_search: true
          fail_ci_if_error: false

  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "./terraform"
